[project]
name = "jltool"
version = "0.1.0"
description = "CLI for managing Jarvislabs.ai infrastructure via the Jarvislabs SDK"
requires-python = ">=3.10"
dependencies = [
    "jarvislabs>=0.2.17,<0.2.18",
    "typer>=0.27.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
jltool = "jltool.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jltool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --color=no"
filterwarnings = [
    "ignore::DeprecationWarning",
]
