name: CI

# Test suite for every PR and for pushes to the long-lived branches.
# Note: no uv.lock is tracked (it is gitignored), so `uv sync` resolves
# dependencies fresh on every run. Ruff is intentionally absent — it is not
# a dependency of this project and the codebase is not ruff-formatted.

on:
  push:
    branches: [master, dev]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync
        run: uv sync
      - name: Tests
        env:
          # Typer force-enables Rich color when GITHUB_ACTIONS is set, which
          # splits option names across ANSI spans and breaks the plain-text
          # substring assertions in tests/test_sdk_coverage.py. This is
          # Typer's own escape hatch (typer/rich_utils.py) and matches the
          # repo's colorless-test intent (pytest addopts --color=no).
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run pytest -q
